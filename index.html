<!--
 * Project: Smart Sudoku Solver (PWA)
 * Developer: Soroush Mirzanaziri
 * Institution: Shahid Beheshti University
 * Description: A web-based Sudoku solver utilizing an optimized Backtracking algorithm.
-->
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sudoku Solver | SBU Project</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .grid-9x9 { display: grid; grid-template-columns: repeat(9, 1fr); gap: 0; border: 2px solid #1f2937; }
        .cell { width: 100%; aspect-ratio: 1; text-align: center; font-size: 1.25rem; border: 1px solid #d1d5db; outline: none; }
        .cell:focus { background-color: #bfdbfe; }
        .cell:nth-child(3n) { border-right: 2px solid #1f2937; }
        .row:nth-child(3n) .cell { border-bottom: 2px solid #1f2937; }
        .solved-text { color: #2563eb; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center py-6 px-4">

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center mb-4 text-gray-800">🤖 Smart Sudoku Solver</h1>
        
        <!-- Fast Import Module -->
        <div class="mb-6 bg-blue-50 p-3 rounded-lg">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Fast Import (81 chars):</label>
            <div class="flex gap-2">
                <input type="text" id="fast-import" placeholder="Example: 530070000600195..." class="flex-1 p-2 border rounded-md text-left text-sm">
                <button onclick="importSudoku()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 text-sm font-semibold">Import</button>
            </div>
            <p id="error-msg" class="text-red-500 text-xs mt-2 hidden"></p>
        </div>

        <!-- Main Sudoku Board -->
        <div id="sudoku-board" class="grid-9x9 mb-6"></div>

        <!-- Action Buttons -->
        <div class="flex gap-3">
            <button onclick="solveSudoku()" class="flex-1 bg-green-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-green-700 shadow-md transition-colors">Solve Board</button>
            <button onclick="clearBoard()" class="flex-1 bg-red-500 text-white py-3 rounded-lg font-bold text-lg hover:bg-red-600 shadow-md transition-colors">Clear</button>
        </div>
    </div>

    <script>
        const boardEl = document.getElementById('sudoku-board');
        const errorMsg = document.getElementById('error-msg');
        let inputs = [];

        function initBoardUI() {
            for (let r = 0; r < 9; r++) {
                let rowDiv = document.createElement('div');
                rowDiv.className = 'row contents';
                let rowInputs = [];
                for (let c = 0; c < 9; c++) {
                    let input = document.createElement('input');
                    input.className = 'cell';
                    input.type = 'tel';
                    input.maxLength = 1;
                    
                    input.addEventListener('input', function() {
                        this.value = this.value.replace(/[^1-9]/g, '');
                        this.classList.remove('solved-text');
                    });
                    
                    rowDiv.appendChild(input);
                    rowInputs.push(input);
                }
                boardEl.appendChild(rowDiv);
                inputs.push(rowInputs);
            }
        }

        function getBoardState() {
            let board = [];
            for (let r = 0; r < 9; r++) {
                let row = [];
                for (let c = 0; c < 9; c++) {
                    let val = inputs[r][c].value;
                    row.push(val === '' ? 0 : parseInt(val));
                }
                board.push(row);
            }
            return board;
        }

        function updateBoardUI(board) {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (inputs[r][c].value === '' && board[r][c] !== 0) {
                        inputs[r][c].value = board[r][c];
                        inputs[r][c].classList.add('solved-text'); 
                    }
                }
            }
        }

        function clearBoard() {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    inputs[r][c].value = '';
                    inputs[r][c].classList.remove('solved-text');
                }
            }
            showError('');
        }

        function showError(msg) {
            if(msg) {
                errorMsg.innerText = msg;
                errorMsg.classList.remove('hidden');
            } else {
                errorMsg.classList.add('hidden');
            }
        }

        function importSudoku() {
            let str = document.getElementById('fast-import').value.replace(/[^0-9\.]/g, '').replace(/\./g, '0');
            if (str.length !== 81) {
                showError('Invalid length. Please enter exactly 81 characters.');
                return;
            }
            clearBoard();
            let idx = 0;
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    let val = str[idx];
                    if (val !== '0') inputs[r][c].value = val;
                    idx++;
                }
            }
        }

        function isValidPlacement(board, row, col, num) {
            for (let x = 0; x < 9; x++) {
                if (board[row][x] === num || board[x][col] === num) return false;
            }
            let startRow = row - row % 3, startCol = col - col % 3;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if (board[i + startRow][j + startCol] === num) return false;
                }
            }
            return true;
        }

        function validateInitialState(board) {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    let num = board[r][c];
                    if (num !== 0) {
                        board[r][c] = 0; 
                        if (!isValidPlacement(board, r, c, num)) return false;
                        board[r][c] = num; 
                    }
                }
            }
            return true;
        }

        function solve(board) {
            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    if (board[row][col] === 0) {
                        for (let num = 1; num <= 9; num++) {
                            if (isValidPlacement(board, row, col, num)) {
                                board[row][col] = num; 
                                if (solve(board)) return true; 
                                board[row][col] = 0; 
                            }
                        }
                        return false; 
                    }
                }
            }
            return true; 
        }

        function solveSudoku() {
            showError('');
            let board = getBoardState();
            
            if (!validateInitialState(board)) {
                showError('Error: Initial board state violates Sudoku rules.');
                return;
            }

            if (solve(board)) {
                updateBoardUI(board);
            } else {
                showError('Error: No valid solution exists for this configuration.');
            }
        }

        initBoardUI();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('ServiceWorker registered'))
                    .catch(err => console.error('ServiceWorker error:', err));
            });
        }
    </script>
</body>
</html>
